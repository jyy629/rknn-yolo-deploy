# === 多路摄像头配置文件 ===
# '#' 开头为注释，key=value 格式，等号两边不要加空格

# 摄像头数量 (1-5)
stream_num=1

# 摄像头 RTSP 地址 (cam1_uri ~ cam5_uri)
cam1_uri=rtsp://admin:lsy123456789@192.168.1.64:554/Streaming/Channels/101
#cam2_uri=rtsp://admin:password@192.168.1.65:554/Streaming/Channels/101
#cam3_uri=rtsp://admin:password@192.168.1.66:554/Streaming/Channels/101
#cam4_uri=rtsp://admin:password@192.168.1.67:554/Streaming/Channels/101
#cam5_uri=rtsp://admin:password@192.168.1.68:554/Streaming/Channels/101

# RKNN 模型路径（设备上的路径）
model_path=./yolov8s_normal_800448_plan_A.rknn

# 输入视频分辨率
video_w=1920
video_h=1080

# RGA 输出分辨率（送 RKNN 推理的尺寸）
dst_w=800
dst_h=448

# YOLOv8 参数
search_extimate=0
iou_extimate=0.5

# HTTP 起始端口（每路摄像头递增：8080, 8081, ...）
http_port=8080

# 调试模式: noisy(吵闹) / quiet(安静)
debug=quiet